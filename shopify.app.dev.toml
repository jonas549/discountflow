# ══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE DESARROLLO — DiscountFlow Dev
#
# Enlazada a la app "DiscountFlow Dev" (Client ID 4e80c45a67c8b263d8b725d4c4c2ece0).
# ESTO NO ES PRODUCCIÓN. Producción = shopify.app.toml (client_id cca497b9...).
#
# Creado a mano (mismos scopes/webhooks que prod) porque el CLI no puede correr
# `shopify app config link` de forma no interactiva en este entorno.
# application_url y redirect_urls son placeholders: `shopify app dev` los reescribe
# con la URL del túnel gracias a automatically_update_urls_on_dev = true.
# ══════════════════════════════════════════════════════════════════════════════

client_id = "4e80c45a67c8b263d8b725d4c4c2ece0"
application_url = "https://discountflow-app.vercel.app"
embedded = true
name = "DiscountFlow Dev"

[access_scopes]
# Mismos scopes que producción
scopes = "read_products,write_products,read_discounts,write_discounts,read_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # ── DEV: orders/create SIN SUSCRIBIR — requiere Protected Customer Data ─────
  #
  # 🔴 CONSECUENCIA PRÁCTICA, para no volver a perder una tarde:
  #    LA ATRIBUCIÓN DE PEDIDOS NO SE PUEDE PROBAR EN DEV. Ni la de packs, ni la
  #    de escalonados, ni la de porcentaje. El pedido se completa, el descuento
  #    se aplica bien, y el webhook NO LLEGA NUNCA. El dashboard se queda en 0
  #    pedidos y ROI N/A. No es un fallo del código.
  #
  # Y tampoco sirve leer el pedido por la API como sustituto: comprobado el
  # 2026-09-05 contra la tienda de dev con el token real, devuelve
  #
  #    HTTP 403 — "This app is not approved to access REST endpoints with
  #    protected customer data"
  #
  # El scope `read_orders` SÍ está concedido; lo que falta es la aprobación de
  # PCD, y bloquea las dos vías. Ni siquiera en una development store.
  #
  # Para poder probarlo en dev hay que pedir el acceso:
  #   Partner Dashboard → DiscountFlow Dev → API access →
  #   Protected customer data access → solicitar Level 1
  # y después DESCOMENTAR este bloque y reinstalar la app en la dev store.
  #
  # Producción sí lo tiene: `shopify.app.toml` lo declara y el Level 1 está
  # aprobado desde mayo de 2026.
  # ───────────────────────────────────────────────────────────────────────────
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/create"
  # topics = ["orders/create"]

  # --- DEV: GDPR compliance comentados temporalmente (PCD no aprobado en app Dev) ---
  # [[webhooks.subscriptions]]
  # compliance_topics = ["customers/data_request"]
  # uri = "/webhooks/customers/data_request"
  #
  # [[webhooks.subscriptions]]
  # compliance_topics = ["customers/redact"]
  # uri = "/webhooks/customers/redact"
  #
  # [[webhooks.subscriptions]]
  # compliance_topics = ["shop/redact"]
  # uri = "/webhooks/shop/redact"

[auth]
redirect_urls = [
  "https://discountflow-app.vercel.app/auth/callback",
  "https://discountflow-app.vercel.app/auth/shopify/callback",
  "https://discountflow-app.vercel.app/api/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/shopify/callback"
]

# ── App proxy: el widget de packs pide su configuración por acá ──────────────
#
# En la tienda, `/apps/discountflow/*` se reenvía FIRMADO a `url` + el resto del
# path. Ver app/routes/apps.discountflow.pack.tsx.
#
# NO añade ningún scope, así que la app no pide reautorización al merchant.
#
# ⚠️ `url` es un placeholder: `shopify app dev` lo reescribe con la URL del túnel
#    gracias a automatically_update_urls_on_dev. Si el widget devolviera 502,
#    lo primero que hay que mirar es si esta URL quedó apuntando a un túnel
#    muerto (Partner Dashboard → App setup → App proxy).
[app_proxy]
url = "https://discountflow-app.vercel.app/apps/discountflow"
subpath = "discountflow"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
