# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Run `shopify app config link` to link this file to your Partner Dashboard app.

client_id = "cca497b9abcf56c14d019ee24d0260d5"
application_url = "https://discountflow-app.vercel.app"
embedded = true
name = "DiscountFlow"

[access_scopes]
# read_products + write_products: modify compareAtPrice & price for PERCENTAGE / RANGE campaigns
# read_orders: attribute orders to campaigns (analytics) — Level 1 PCD approved 2026-05
# read_discounts + write_discounts: create and manage Shopify Functions automatic discounts (BXGY)
scopes = "read_products,write_products,read_discounts,write_discounts,read_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = ["orders/create"]

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

# ══════════════════════════════════════════════════════════════════════════════
# App proxy: lo necesita el widget de packs.
#
# Ruta publica en el storefront: /apps/discountflow/pack
#
# NO es el camino normal —el bloque de tema se pinta entero en el servidor
# leyendo el metafield— pero es la red de seguridad: repara el catalogo cuando
# `all_products` de Liquid resuelve menos de 20 handles (su limite por pagina,
# compartido con el resto del tema) y revalida en segundo plano.
#
# Sin este bloque packs funciona, pero el comprador puede ver menos productos de
# los configurados sin que nadie se entere.
# ══════════════════════════════════════════════════════════════════════════════
[app_proxy]
url = "https://discountflow-app.vercel.app/apps/discountflow"
subpath = "discountflow"
prefix = "apps"

[auth]
redirect_urls = [
  "https://discountflow-app.vercel.app/auth/callback",
  "https://discountflow-app.vercel.app/auth/shopify/callback",
  "https://discountflow-app.vercel.app/api/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
